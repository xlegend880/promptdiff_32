name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: 测试 / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装项目
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: 单元测试
        run: python -m unittest discover -s tests -t . -v

      - name: 编译检查
        run: python -m compileall -q promptdiff tests

  demo:
    name: 离线演示（验证回归门禁主链路）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 运行 demo
        run: |
          bash scripts/demo.sh
          test -f build/diff.md
          grep -q "回归" build/diff.md

      - name: 上传报告
        uses: actions/upload-artifact@v4
        with:
          name: promptdiff-reports
          path: build/*.md
          if-no-files-found: error
