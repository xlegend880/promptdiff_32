[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "promptdiff-32"
version = "0.3.0"
description = "面向 LLM 应用的提示词回归测试工具：跑用例、存基线、比差异，零第三方依赖"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "fzx", email = "748679061@qq.com" }]
keywords = ["llm", "prompt-engineering", "regression-testing", "evaluation", "ci", "prompt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/xlegend880/promptdiff_32"
Repository = "https://github.com/xlegend880/promptdiff_32"
Issues = "https://github.com/xlegend880/promptdiff_32/issues"
Changelog = "https://github.com/xlegend880/promptdiff_32/blob/main/CHANGELOG.md"

[project.scripts]
promptdiff = "promptdiff.cli:main"

[tool.setuptools]
packages = ["promptdiff"]
